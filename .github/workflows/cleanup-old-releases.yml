name: Keep only the newest release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove older releases and tags
    runs-on: ubuntu-latest
    steps:
      - name: Delete every release except the one just published
        uses: actions/github-script@v7
        with:
          script: |
            const currentReleaseId = context.payload.release.id;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            for (const release of releases) {
              if (release.id === currentReleaseId) continue;

              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
